<h1>Login form</h1>

<p>
  <label for="email">Email</label><br>
  <input type="text" id="email">
</p>
<p>
  <label><input type="checkbox" id="remember-me"> Remember me</label>
</p>
<p>
  <button id="enterimg">Login</button>
</p>
<p id="welcome-back" style="display:none;"></p>

<script>
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}

document.getElementById('enterimg').addEventListener('click', function () {
  const email = document.getElementById('email').value;
  const rememberMe = document.getElementById('remember-me').checked;
  if (rememberMe && email) {
    document.cookie = 'remembered_email=' + encodeURIComponent(email) + ';path=/';
  }
});

window.addEventListener('load', function () {
  const remembered = getCookie('remembered_email');
  if (remembered) {
    document.getElementById('email').value = remembered;
    const welcomeBack = document.getElementById('welcome-back');
    welcomeBack.textContent = 'Welcome back, ' + remembered + '!';
    welcomeBack.style.display = 'block';
  }
});
</script>
