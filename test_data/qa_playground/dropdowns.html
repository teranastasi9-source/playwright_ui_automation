<h1>Registration form</h1>

<p>
  <label for="Skills">Skills</label><br>
  <select id="Skills">
    <option value=""></option>
    <option value="Python">Python</option>
    <option value="Java">Java</option>
    <option value="JavaScript">JavaScript</option>
  </select>
</p>

<p>
  Gender:
  <label><input type="radio" name="gender" value="Male"> Male</label>
  <label><input type="radio" name="gender" value="FeMale"> FeMale</label>
</p>

<p>
  Sports:
  <label><input type="checkbox" value="Cricket"> Cricket</label>
  <label><input type="checkbox" value="Football"> Football</label>
  <label><input type="checkbox" value="Hockey"> Hockey</label>
</p>

<p>
  <button id="submit-registration">Submit</button>
</p>
<p id="summary" style="display:none;"></p>

<script>
document.getElementById('submit-registration').addEventListener('click', function () {
  const skill = document.getElementById('Skills').value;
  const gender = document.querySelector('input[name="gender"]:checked');
  const sports = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

  const parts = [
    'Skills: ' + (skill || 'none'),
    'Gender: ' + (gender ? gender.value : 'none'),
    'Sports: ' + (sports.length ? sports.join(', ') : 'none'),
  ];

  const summary = document.getElementById('summary');
  summary.textContent = parts.join(' | ');
  summary.style.display = 'block';
});
</script>
