<h1>Category</h1>

<p>
  <select id="s1" onchange="loadSubcategories(this.value)">
    <option value="0">Select category</option>
    <option value="1">Fruits</option>
    <option value="2">Vegetables</option>
  </select>
</p>
<ul id="subcategory-list"></ul>

<script>
const categoryFiles = {"1": "dd-ajax-fruits.json", "2": "dd-ajax-vegetables.json"};

function loadSubcategories(value) {
  const list = document.getElementById('subcategory-list');
  list.innerHTML = '';
  const file = categoryFiles[value];
  if (!file) return;  // "Select category" (0) or an unknown value - leave the list empty
  fetch(file)
    .then(response => response.json())
    .then(data => {
      data.data.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item.subcategory;
        list.appendChild(li);
      });
    });
}
</script>
