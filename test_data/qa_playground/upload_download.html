<h1>Upload / Download</h1>

<p>
  <label for="input-4">Browse...</label><br>
  <input type="file" id="input-4">
</p>

<p>
  <a id="download-link" href="some-file.txt" download>some-file.txt</a>
</p>

<script>
// Once a file is selected, the download link switches from the default sample file to
// offering back the exact file that was just uploaded - a real round trip, not two
// unrelated actions on the same page.
document.getElementById('input-4').addEventListener('change', function (event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    const blob = new Blob([reader.result], {type: 'text/plain'});
    const link = document.getElementById('download-link');
    link.href = URL.createObjectURL(blob);
    link.textContent = file.name;
    link.setAttribute('download', file.name);
  };
  reader.readAsText(file);
});
</script>
</body>
