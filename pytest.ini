[pytest]
log_cli = true
log_cli_level = INFO
pythonpath = tests
; --html/--log-file below are just fallback defaults - conftest.py's
; pytest_configure renames both to reports/report_<browser>.html /
; reports/test_logs_<browser>.log automatically, unless overridden here
; explicitly on the command line.
addopts =
    --html=reports/report.html
    --self-contained-html
    --css=report_style.css
    --log-file=reports/test_logs.log
    --log-file-level=INFO
markers =
    api: tests that hit an HTTP API directly, with no browser involved
    smoke: fast, high-value checks - good candidate for a quick pre-merge run (pytest -m smoke)
    slow: tests that are noticeably heavier (multi-step flows, video recording) - skip with pytest -m "not slow"
    flaky: tests that are auto-retried via pytest-rerunfailures (see the marker's own reruns=/reruns_delay= arguments on each use for why)
    no_browsers(*names, reason=...): skip this test on the given browser engine(s) - e.g. @pytest.mark.no_browsers("firefox", "webkit", reason="..."). See conftest.py's pytest_runtest_setup.
    no_browsers_in_ci(*names, reason=...): like no_browsers, but only skips when the CI env var is "true" - for a site that works fine on these browsers locally but not from GitHub Actions' datacenter IPs. See conftest.py's pytest_runtest_setup.

