[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names, etc.)
    "I",   # import sorting
    "B",   # flake8-bugbear (common bug patterns, e.g. bare except)
    "UP",  # pyupgrade (modern Python idioms)
]
