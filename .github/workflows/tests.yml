name: Tests
# The static name above applies to every trigger alike (push/PR just run lint+smoke, schedule/
# workflow_dispatch run the full suite + Pages deploy) - renaming it to describe the full-suite
# path specifically would be misleading on an ordinary push. run-name instead gives each
# individual run a title that actually matches what it did, shown in the Actions run list and
# when picking "Run workflow" manually.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Daily full suite + Pages deploy'
   || github.event_name == 'workflow_dispatch' && 'Full suite + Pages deploy (manual)'
   || format('Lint + smoke - {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full suite once a week (Monday), independent of anyone pushing - catches drift caused
    # by the third-party demo sites this project depends on, not just code changes. Was daily
    # until 2026-08-05: a single bad evening for opensource-demo.orangehrmlive.com (verified
    # directly, independent of CI - see triage-test-failure skill) produced several days' worth
    # of red runs to triage for no real signal. Run on demand via workflow_dispatch any time a
    # fresh report is actually needed (e.g. before sharing the portfolio link).
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  smoke:
    name: Smoke tests (push / PR)
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run smoke tests
        run: |
          # test_search_results_title_contains_playwright is deliberately excluded here:
          # Google actively bot-checks/CAPTCHAs automated searches from datacenter IP
          # ranges, which is what GitHub-hosted runners use. It's stable from a normal
          # dev machine but not reliable from CI specifically - see the
          # triage-test-failure skill for the same pattern applied to other sites.
          pytest tests -m smoke -k "not test_search_results_title_contains_playwright" -v
      - name: Upload report (always, so failures are inspectable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: reports/
          retention-days: 14

  full-suite:
    name: Full suite (${{ matrix.browser }}) - scheduled / manual
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run the full suite
        run: |
          # test_search_results_title_contains_playwright: excluded on every browser - see the
          # smoke job above, same root cause (Google bot-checks GitHub's datacenter IPs,
          # regardless of which browser engine is asking - not a per-browser issue, so it
          # isn't handled by the @pytest.mark.no_browsers marker below).
          #
          # The expandtesting.com login tests are NOT excluded here: they carry
          # @pytest.mark.no_browsers("firefox", "webkit", reason=...) and are skipped
          # automatically on those engines by conftest.py's pytest_runtest_setup - see
          # "Cross-browser testing" in README.md for the verified root cause.
          #
          # --reruns 1: this job already accepts that it hits many volatile third-party demo
          # sites (that's its whole point per the schedule trigger's comment above) - a single
          # rerun absorbs an occasional one-off site blip (verified 2026-08-04:
          # test_mouse_actions failed once here on Chromium, passed immediately on a plain
          # local re-run, never reproduced again - ordinary public-demo-site noise, not a bug)
          # without masking a real regression the way retrying forever would. Deliberately not
          # applied to the smoke job above - that's the fast, strict pre-merge gate, and it
          # should fail loudly on the first try. A test with its own
          # @pytest.mark.flaky(reruns=N) keeps that N - the marker takes priority over this
          # global default, it doesn't add to it (see pytest-rerunfailures' get_reruns_count).
          pytest tests --browser=${{ matrix.browser }} -k "not test_search_results_title_contains_playwright" --reruns 1 --reruns-delay 3 -v
      - name: Upload report (always, so failures are inspectable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-report-${{ matrix.browser }}
          path: reports/
          retention-days: 14

  pages:
    name: Deploy latest report to GitHub Pages
    needs: full-suite
    # Same trigger as full-suite above, since it's what feeds this job's report - the live
    # report refreshes daily (schedule) or on-demand (workflow_dispatch), not on every push.
    # A previous version ran a dedicated full-chromium job on every push instead, but that
    # duplicated full-suite's chromium leg almost exactly (same command, different trigger)
    # for the sole benefit of same-push freshness - not worth the added CI time and upkeep
    # (see git history if that tradeoff needs revisiting).
    # Requires Pages enabled once in repo Settings > Pages > Source: "GitHub Actions" (a
    # one-time manual step, not something a workflow file can set).
    #
    # !cancelled() (not the default "needs full-suite to succeed", and deliberately not a
    # blanket always()) - deploys the latest report even if some/all browsers had real test
    # failures, only skipping on a genuine cancellation. This project already uploads every
    # test report unconditionally ("so failures are inspectable" - see the smoke/full-suite
    # jobs above); a report that's honestly red is more useful here than no report, or a stale
    # green one from days ago, especially given how often the failures we've actually hit are
    # external-site flakiness rather than real regressions (see triage-test-failure skill).
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # continue-on-error: a browser leg that hard-timed-out (see timeout-minutes on full-suite)
      # may never have uploaded an artifact at all - one missing report shouldn't block
      # deploying the other two, so a failed download here is handled by the staging step
      # below (it checks each file exists) rather than failing the job outright.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: full-test-report-chromium
          path: reports/chromium/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: full-test-report-firefox
          path: reports/firefox/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: full-test-report-webkit
          path: reports/webkit/
      - name: Stage whichever reports are available as the Pages site
        id: stage
        # Each report_<browser>.html is fully self-contained (pytest.ini's
        # --self-contained-html inlines CSS/JS), so each can be served as-is. Chromium stays at
        # the site root (index.html) since that's the URL already linked from README/GIF/profile
        # - firefox/webkit are added alongside it, not replacing it. Deployed pass or fail (see
        # this job's `if:` above), so failing tests must not stop reports that DID generate from
        # being staged - each browser is copied independently, guarded by its own file check.
        #
        # The pytest-html reports have no built-in cross-linking, and the only link GitHub
        # itself ever shows (the Actions deployment summary) can only ever point at the site
        # root - so without this, anyone landing on any single report has no way to discover
        # the other two exist. A small nav bar with links to all three is injected into each
        # (sed delimiter is | rather than the more common / or # - both appear inside the CSS
        # hex colors used here, e.g. #79c0ff, and would otherwise break the substitution).
        run: |
          mkdir -p _site

          NAV_STYLE='background:#24292f;color:#c9d1d9;padding:10px 16px;font-family:-apple-system,sans-serif;font-size:14px'
          LINK_STYLE='color:#79c0ff;margin-right:14px'
          CUR_STYLE='color:#fff;margin-right:14px'

          NAV_CHROMIUM="<div style=\"$NAV_STYLE\">Browser: <strong style=\"$CUR_STYLE\">chromium</strong><a href=\"firefox.html\" style=\"$LINK_STYLE\">firefox</a><a href=\"webkit.html\" style=\"$LINK_STYLE\">webkit</a></div>"
          NAV_FIREFOX="<div style=\"$NAV_STYLE\">Browser: <a href=\"./\" style=\"$LINK_STYLE\">chromium</a><strong style=\"$CUR_STYLE\">firefox</strong><a href=\"webkit.html\" style=\"$LINK_STYLE\">webkit</a></div>"
          NAV_WEBKIT="<div style=\"$NAV_STYLE\">Browser: <a href=\"./\" style=\"$LINK_STYLE\">chromium</a><a href=\"firefox.html\" style=\"$LINK_STYLE\">firefox</a><strong style=\"$CUR_STYLE\">webkit</strong></div>"

          if [ -f reports/chromium/report_chromium.html ]; then
            cp reports/chromium/report_chromium.html _site/index.html
            sed -i "s|<body>|<body>${NAV_CHROMIUM}|" _site/index.html
            echo "chromium=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No chromium report available this run - site root not updated"
            echo "chromium=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f reports/firefox/report_firefox.html ]; then
            cp reports/firefox/report_firefox.html _site/firefox.html
            sed -i "s|<body>|<body>${NAV_FIREFOX}|" _site/firefox.html
            echo "firefox=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No firefox report available this run - firefox.html not updated"
            echo "firefox=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f reports/webkit/report_webkit.html ]; then
            cp reports/webkit/report_webkit.html _site/webkit.html
            sed -i "s|<body>|<body>${NAV_WEBKIT}|" _site/webkit.html
            echo "webkit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No webkit report available this run - webkit.html not updated"
            echo "webkit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete stale github-pages artifact from a previous attempt, if any
        # Re-running this workflow (rather than triggering a fresh workflow_dispatch) leaves
        # the previous attempt's already-uploaded "github-pages" artifact in place -
        # upload-pages-artifact always uses that same fixed name, so a second attempt collides
        # with it and deploy-pages fails with "Multiple artifacts named github-pages...
        # Artifact count is 2" (verified 2026-08-05: happened after re-running a run whose
        # pages job had already succeeded once). Not a code bug, a known interaction between
        # GitHub's re-run mechanism and Pages artifacts - deleting any leftover one first makes
        # re-runs safe too, not just fresh runs. No-op (empty jq result, loop body never runs)
        # on a normal first attempt where nothing stale exists yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r artifact_id; do
            echo "Deleting stale github-pages artifact $artifact_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarize all three report links
        # The environment "view deployment" link GitHub shows above can only ever be the site
        # root (chromium) - actions/deploy-pages only ever outputs one URL, there's no way to
        # make it list more. This writes an explicit, correct list of all three report URLs to
        # the job summary instead, right next to that single (misleading on its own) link.
        run: |
          {
            echo "### Deployed reports"
            echo ""
            if [ "${{ steps.stage.outputs.chromium }}" = "true" ]; then
              echo "- [chromium](${{ steps.deployment.outputs.page_url }})"
            else
              echo "- chromium: not updated this run (no report available)"
            fi
            if [ "${{ steps.stage.outputs.firefox }}" = "true" ]; then
              echo "- [firefox](${{ steps.deployment.outputs.page_url }}firefox.html)"
            else
              echo "- firefox: not updated this run (no report available)"
            fi
            if [ "${{ steps.stage.outputs.webkit }}" = "true" ]; then
              echo "- [webkit](${{ steps.deployment.outputs.page_url }}webkit.html)"
            else
              echo "- webkit: not updated this run (no report available)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
